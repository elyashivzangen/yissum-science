<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IBKR Closed Lots CSV</title><style>body{font-family:Arial;background:#f6f8fb;margin:0}main{max-width:850px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;margin:14px}.ok{background:#eefaf0;border:1px solid #b8e5c0}.bad{background:#fee2e2;border:1px solid #fecaca}input,button{font-size:18px;padding:10px;margin:8px}button{background:#1f6feb;color:white;border:0;border-radius:10px}</style></head><body><main><h1>IBKR - חילוץ מכירות ClosedLot</h1><div class="card">העלה Activity Statement CSV. הדף יחלץ את שורות ClosedLot ויוריד CSV שאפשר לפתוח באקסל.</div><div class="card"><input id="file" type="file" accept=".csv,text/csv"><button onclick="run()">חלץ והורד CSV</button><p id="msg"></p></div></main><script>
function clean(x){return String(x||'').replace(/^\uFEFF/,'').trim()}function num(x){let n=parseFloat(clean(x).replace(/,/g,''));return isNaN(n)?0:n}function dt(x){let s=clean(x).split(',')[0],m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:''}function csv(t){let a=[],r=[],c='',q=false;for(let i=0;i<t.length;i++){let ch=t[i],nx=t[i+1];if(q){if(ch==='"'&&nx==='"'){c+='"';i++}else if(ch==='"')q=false;else c+=ch}else{if(ch==='"')q=true;else if(ch===','){r.push(c);c=''}else if(ch==='\n'){r.push(c);a.push(r);r=[];c=''}else if(ch==='\r'){}else c+=ch}}r.push(c);a.push(r);return a.filter(x=>x.some(y=>clean(y)))}
function get(o,k){return clean(o[k]||'')}function period(d){return d&&d.slice(5,7)<='06'?'H1':'H2'}
function esc(x){let s=String(x==null?'':x);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
async function run(){let f=document.getElementById('file').files[0];if(!f){alert('בחר CSV');return}let rows=csv(await f.text()),head=null,lastSale={},out=[],debug=[];for(let i=0;i<rows.length;i++){let r=rows[i],sec=clean(r[0]),typ=clean(r[1]);if(sec==='Trades'&&typ==='Header'){head=r.slice(2).map(clean);debug.push('header '+(i+1));continue}if(sec!=='Trades'||typ!=='Data'||!head)continue;let o={};head.forEach((h,j)=>o[h]=clean(r[2+j]));if(get(o,'Asset Category')!=='Stocks'||get(o,'Currency')!=='USD')continue;let dd=get(o,'DataDiscriminator'),sym=get(o,'Symbol'),q=num(get(o,'Quantity'));if((dd==='Order'||dd==='Trade')&&q<0)lastSale[sym]=dt(get(o,'Date/Time'));if(dd==='ClosedLot'){let buy=dt(get(o,'Date/Time')),sell=lastSale[sym]||'',basis=Math.abs(num(get(o,'Basis'))),pl=num(get(o,'Realized P/L')),net=basis+pl;out.push([i+1,sym,buy,sell,period(sell),Math.abs(q),basis,net,pl,get(o,'Code')]);}}let headers=['source_row','symbol','buy_date','sell_date','period','quantity','cost_basis_usd','net_proceeds_usd','ibkr_realized_pl_usd','code'];let text='\ufeff'+[headers,...out].map(r=>r.map(esc).join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download='ibkr_closedlots.csv';a.click();document.getElementById('msg').className=out.length?'ok':'bad';document.getElementById('msg').textContent='זוהו '+out.length+' שורות ClosedLot. '+(out.length?'הקובץ ירד.':'לא נמצאו שורות; ודא שזה Activity Statement CSV.');}
</script></body></html>
