<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IBKR BOI XLSX</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    body{font-family:Arial;margin:0;background:#f6f8fb;color:#172033}main{max-width:1000px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #d8e0ec;border-radius:14px;padding:18px;margin:14px 0}.warn{background:#fff4e5;border-color:#ffd59e}.ok{background:#eefaf0;border:1px solid #b8e5c0}.bad{background:#fee2e2;border:1px solid #fecaca}input{width:100%;box-sizing:border-box;padding:10px;margin:6px 0;border:1px solid #c7d1df;border-radius:8px}button{background:#1f6feb;color:#fff;border:0;border-radius:10px;padding:12px 18px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.ltr{direction:ltr;text-align:left}small{color:#536179}
  </style>
</head>
<body><main>
  <h1>IBKR - XLSX עם שערי בנק ישראל</h1>
  <div class="card warn"><b>מקור שערים:</b> האתר קורא קובץ <span class="ltr">boi_fx_rates.json</span> שנוצר מתוך API של בנק ישראל על ידי GitHub Action. לכל תאריך קנייה/מכירה נלקח שער הדולר היציג לאותו יום, ואם אין שער באותו יום - השער האחרון שפורסם לפניו.</div>
  <div class="card">
    <h2>העלה CSV של IBKR</h2>
    <input id="file" type="file" accept=".csv,text/csv">
    <div class="grid">
      <div><label>מס רווח הון</label><input id="cap" type="number" step="0.01" value="0.25"></div>
      <div><label>מס דיבידנד</label><input id="divt" type="number" step="0.01" value="0.25"></div>
      <div><label>הפסד מועבר בשח</label><input id="loss" type="number" step="1" value="0"></div>
      <div><label>מקדמות ששולמו בשח</label><input id="paid" type="number" step="1" value="0"></div>
    </div>
    <button onclick="run()">חשב והורד XLSX</button>
    <p id="status"><small>טוען קובץ שערים מבנק ישראל...</small></p>
  </div>
</main>
<script>
let FX_CACHE=null;
async function loadFx(){try{let r=await fetch('boi_fx_rates.json?ts='+Date.now());FX_CACHE=await r.json();setStatus('קובץ שערים נטען. מקור: '+(FX_CACHE.source||'Bank of Israel')+' | עדכון: '+(FX_CACHE.updated_at||'לא ידוע'),'ok')}catch(e){setStatus('לא הצלחתי לטעון boi_fx_rates.json. נסה לרענן את הדף.','bad')}}
loadFx();
function setStatus(t,cls){let el=document.getElementById('status');el.className=cls||'';el.textContent=t}
function clean(v){return String(v??'').replace(/^\uFEFF/,'').trim()}
function n(v){let x=parseFloat(clean(v).replace(/,/g,''));return isNaN(x)?0:x}
function d(v){if(!v)return'';let s=clean(v).split(',')[0],m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];let z=new Date(s);return isNaN(z)?'':z.toISOString().slice(0,10)}
function per(x){return x&&x.slice(5,7)<='06'?'H1':'H2'}
function sym(s){let m=clean(s).match(/^([A-Z0-9.\-]+)\(/);return m?m[1]:''}
function detectDelimiter(text){let lines=text.split(/\r?\n/).filter(x=>x.trim()).slice(0,40), delims=[',',';','\t'];let best=',',score=-1;for(const dl of delims){let sc=0;for(const ln of lines){sc+=parseCsvLine(ln,dl).length}if(sc>score){score=sc;best=dl}}return best}
function parseCsvLine(line,delim){let out=[],c='',q=false;for(let i=0;i<line.length;i++){let ch=line[i],nx=line[i+1];if(q){if(ch==='"'&&nx==='"'){c+='"';i++}else if(ch==='"')q=false;else c+=ch}else{if(ch==='"')q=true;else if(ch===delim){out.push(c);c=''}else c+=ch}}out.push(c);return out}
function parseDelimited(text){let delim=detectDelimiter(text),rows=[],row=[],c='',q=false;for(let i=0;i<text.length;i++){let ch=text[i],nx=text[i+1];if(q){if(ch==='"'&&nx==='"'){c+='"';i++}else if(ch==='"')q=false;else c+=ch}else{if(ch==='"')q=true;else if(ch===delim){row.push(c);c=''}else if(ch==='\n'){row.push(c);rows.push(row);row=[];c=''}else if(ch==='\r'){}else c+=ch}}row.push(c);rows.push(row);rows=rows.filter(x=>x.some(y=>clean(y)));return {rows,delim}}
function sourceUrl(dt){let base=FX_CACHE&&FX_CACHE.source_url?FX_CACHE.source_url:'https://edge.boi.gov.il/FusionEdgeServer/sdmx/v2/data/dataflow/BOI.STATISTICS/EXR/1.0/?c%5BBASE_CURRENCY%5D=USD&c%5BCOUNTER_CURRENCY%5D=ILS&format=csv';return base+'&endPeriod='+dt+'&lastNObservations=1'}
function rateFor(eventDate){let rates=(FX_CACHE&&FX_CACHE.rates)||{};let cur=new Date(eventDate+'T00:00:00Z');for(let i=0;i<31;i++){let key=cur.toISOString().slice(0,10);if(rates[key])return{event_date:eventDate,rate_date:key,rate:Number(rates[key]),source_url:sourceUrl(eventDate),status:key===eventDate?'exact BOI date':'previous published BOI rate'};cur.setUTCDate(cur.getUTCDate()-1)}return{event_date:eventDate,rate_date:'',rate:null,source_url:sourceUrl(eventDate),status:'MISSING - update BOI cache or enter manually'}}
function recog(nom,usd){if(nom>0&&usd>0)return Math.min(nom,usd);if(nom<0&&usd<0)return -Math.min(Math.abs(nom),Math.abs(usd));return 0}
function get(o,names){for(const k of names){if(o[k]!==undefined)return clean(o[k])}return''}
function isStocks(asset){return /stock|stocks|equity|מניות/i.test(clean(asset))}
function parseIbkr(rows,delim){let H={},saleBySymbol={},lots=[],divs=[],wh=[],sd=new Set(),sw=new Set(),sections={},debug={delimiter:delim==='\t'?'tab':delim,totalRows:rows.length,tradeRows:0,sellOrders:0,closedLotsInCsv:0,parsedLots:0,parsedDividends:0,parsedWithholding:0,reason:''};rows.forEach((r,i)=>{let sec=clean(r[0]),kind=clean(r[1]);if(sec)sections[sec]=(sections[sec]||0)+1;if(kind==='Header'){H[sec]=r.slice(2).map(clean);return}if(kind!=='Data')return;let h=H[sec]||[],o={};h.forEach((k,j)=>o[k]=clean(r[2+j]));if(sec==='Trades'){debug.tradeRows++;let dd=get(o,['DataDiscriminator','Data Discriminator']),asset=get(o,['Asset Category','AssetCategory']),cur=get(o,['Currency']),s=get(o,['Symbol']);let qty=n(get(o,['Quantity','Qty'])),dt=d(get(o,['Date/Time','Date Time','Trade Date','Date'])),pl=n(get(o,['Realized P/L','Realized P&L','Realized PL']));let proceeds=n(get(o,['Proceeds','Net Proceeds']));let comm=n(get(o,['Comm/Fee','Commission','Fees']));if(isStocks(asset)&&cur==='USD'&&(dd==='Order'||dd==='Trade')&&qty<0){saleBySymbol[s]={symbol:s,sell_date:dt,sell_qty:Math.abs(qty),proceeds:proceeds,commission:comm};debug.sellOrders++}if(isStocks(asset)&&cur==='USD'&&dd==='ClosedLot'){debug.closedLotsInCsv++;let sale=saleBySymbol[s]||{};let basis=Math.abs(n(get(o,['Basis','Cost Basis','CostBasis'])));let q=Math.abs(qty);let buyDate=d(get(o,['Date/Time','Date Time','Buy Date','Open Date','Date Acquired']));let sellDate=sale.sell_date||d(get(o,['Close Date','Sell Date','Date Sold','Closing Date']));if(sellDate&&buyDate&&basis){lots.push({source_row:i+1,symbol:s,buy_date:buyDate,sell_date:sellDate,period:per(sellDate),quantity:q,cost_basis_usd:basis,net_proceeds_usd:basis+pl,ibkr_pl_usd:pl,code:get(o,['Code'])})}}
    }
    if(sec==='Dividends'&&get(o,['Currency'])==='USD'){let dt=d(get(o,['Date','Date/Time'])),amt=n(get(o,['Amount','Gross Amount'])),de=get(o,['Description']);let key=dt+'|'+de+'|'+amt;if(dt&&!sd.has(key)){divs.push({source_row:i+1,date:dt,symbol:sym(de),description:de,gross_usd:amt});sd.add(key)}}
    if(sec==='Withholding Tax'&&get(o,['Currency'])==='USD'){let dt=d(get(o,['Date','Date/Time'])),amt=Math.abs(n(get(o,['Amount','Tax','Withholding']))),de=get(o,['Description']);let key=dt+'|'+de+'|'+amt;if(dt&&!sw.has(key)){wh.push({date:dt,symbol:sym(de),usd:amt});sw.add(key)}}
  });
  if(!lots.length){let fb=parseFlatLots(rows);lots=fb.lots;if(fb.lots.length)debug.reason='parsed with generic flat-table fallback';else debug.reason='לא נמצאו שורות Trades/Data/ClosedLot. ודא שזה Activity Statement CSV עם section Trades. אם זה דוח Realized Summary בלבד אין בו שכבות קנייה.'}
  debug.parsedLots=lots.length;debug.parsedDividends=divs.length;debug.parsedWithholding=wh.length;debug.sections=Object.entries(sections).slice(0,30).map(x=>x.join(': ')).join(' | ');return{lots,divs,wh,debug,rawPreview:rows.slice(0,30)}}
function parseFlatLots(rows){let lots=[];for(let i=0;i<Math.min(rows.length,80);i++){let head=rows[i].map(clean),low=head.map(x=>x.toLowerCase());let hasSymbol=low.some(x=>x==='symbol'||x.includes('symbol'));let hasBuy=low.some(x=>x.includes('buy')||x.includes('acquired')||x.includes('open date'));let hasSell=low.some(x=>x.includes('sell')||x.includes('sold')||x.includes('close date'));let hasBasis=low.some(x=>x.includes('basis')||x.includes('cost'));let hasPL=low.some(x=>x.includes('p/l')||x.includes('p&l')||x.includes('realized'));
    if(hasSymbol&&hasBuy&&hasSell&&hasBasis&&hasPL){let idx=(terms)=>low.findIndex(h=>terms.some(t=>h.includes(t)));let ixSym=idx(['symbol']),ixBuy=idx(['buy','acquired','open date']),ixSell=idx(['sell','sold','close date']),ixQty=idx(['quantity','qty']),ixBasis=idx(['basis','cost']),ixPro=idx(['proceeds']),ixPL=idx(['p/l','p&l','realized']);for(let j=i+1;j<rows.length;j++){let r=rows[j];if(!r||!r.some(x=>clean(x)))continue;let s=clean(r[ixSym]),buy=d(r[ixBuy]),sell=d(r[ixSell]),basis=Math.abs(n(r[ixBasis])),pl=n(r[ixPL]);if(!s||!buy||!sell||!basis)continue;let proceeds=ixPro>=0?n(r[ixPro]):basis+pl;lots.push({source_row:j+1,symbol:s,buy_date:buy,sell_date:sell,period:per(sell),quantity:ixQty>=0?Math.abs(n(r[ixQty])):0,cost_basis_usd:basis,net_proceeds_usd:proceeds,ibkr_pl_usd:pl,code:'fallback'})}return{lots}}}
  return{lots}}
async function run(){if(!FX_CACHE){alert('קובץ שערי בנק ישראל עדיין לא נטען');return}let file=document.getElementById('file').files[0];if(!file){alert('בחר CSV');return}let text=await file.text(),parsed=parseDelimited(text),p=parseIbkr(parsed.rows,parsed.delim);let cap=n(document.getElementById('cap').value),divt=n(document.getElementById('divt').value),carry=n(document.getElementById('loss').value),paid=n(document.getElementById('paid').value);let allDates=[...new Set([...p.lots.flatMap(x=>[x.buy_date,x.sell_date]),...p.divs.map(x=>x.date),...p.wh.map(x=>x.date)].filter(Boolean))].sort();let fxRows=allDates.map(x=>rateFor(x)),fxMap=Object.fromEntries(fxRows.map(x=>[x.event_date,x]));let whMap={};p.wh.forEach(w=>{let k=w.date+'|'+w.symbol;whMap[k]=(whMap[k]||0)+w.usd});let cg=p.lots.map(x=>{let b=fxMap[x.buy_date]||rateFor(x.buy_date),s=fxMap[x.sell_date]||rateFor(x.sell_date),cost=b.rate?x.cost_basis_usd*b.rate:null,cons=s.rate?x.net_proceeds_usd*s.rate:null,nom=(cost!=null&&cons!=null)?cons-cost:null,usd=s.rate?(x.net_proceeds_usd-x.cost_basis_usd)*s.rate:null,rec=(nom!=null&&usd!=null)?recog(nom,usd):null;return{...x,buy_fx:b.rate,buy_fx_date:b.rate_date,buy_fx_source:b.source_url,sell_fx:s.rate,sell_fx_date:s.rate_date,sell_fx_source:s.source_url,cost_nis_at_buy_fx:cost,consideration_nis_at_sell_fx:cons,nominal_gain_loss_nis:nom,usd_pl_at_sell_fx_nis:usd,recognized_gain_loss_nis:rec,tax_nis:rec!=null?Math.max(rec,0)*cap:null}});let dv=p.divs.map(x=>{let f=fxMap[x.date]||rateFor(x.date),gross=f.rate?x.gross_usd*f.rate:null,ftusd=whMap[x.date+'|'+x.symbol]||0,ftnis=f.rate?ftusd*f.rate:null,before=gross!=null?gross*divt:null,credit=(ftnis!=null&&before!=null)?Math.min(ftnis,before):null,add=(before!=null&&credit!=null)?Math.max(before-credit,0):null;return{...x,fx:f.rate,fx_rate_date:f.rate_date,fx_source:f.source_url,gross_nis:gross,foreign_tax_usd:ftusd,foreign_tax_nis:ftnis,israeli_tax_before_credit_nis:before,foreign_tax_credit_used_nis:credit,additional_israeli_tax_nis:add}});let gains=sum(cg.map(x=>Math.max(x.recognized_gain_loss_nis||0,0))),losses=sum(cg.map(x=>Math.min(x.recognized_gain_loss_nis||0,0))),net=gains+losses,taxable=Math.max(net-Math.max(carry,0),0),capTax=taxable*cap,divGross=sum(dv.map(x=>x.gross_nis||0)),foreign=sum(dv.map(x=>x.foreign_tax_nis||0)),divAdd=sum(dv.map(x=>x.additional_israeli_tax_nis||0)),balance=Math.max(capTax+divAdd-paid,0);let wb=XLSX.utils.book_new();add(wb,'Summary',[['Metric','YTD_NIS'],['Recognized capital gains',gains],['Recognized capital losses',losses],['Net capital gain/loss before carried loss',net],['Gross dividends',divGross],['Foreign tax on dividends',foreign],['Additional Israeli tax on dividends',divAdd],['Taxable capital gain after carried loss',taxable],['Estimated capital gains tax',capTax],['Paid advances entered',paid],['Estimated total balance to pay',balance]]);add(wb,'Inputs',[['Parameter','Value'],['Capital gains tax rate',cap],['Dividend tax rate',divt],['Carried capital loss NIS',carry],['Paid advances NIS',paid],['FX cache source',FX_CACHE.source],['FX cache updated_at',FX_CACHE.updated_at||'']]);add(wb,'BOI_FX_Rates',[['Event_Date','Used_Rate_Date','USD_ILS_Rate','Status','BOI_Source_URL'],...fxRows.map(x=>[x.event_date,x.rate_date,x.rate||'',x.status,x.source_url])]);add(wb,'Capital_Gains',objRows(cg));add(wb,'Dividends_Tax',objRows(dv));add(wb,'Debug',[['Field','Value'],...Object.entries(p.debug),['Missing FX dates',fxRows.filter(x=>!x.rate).map(x=>x.event_date).join(', ')||'none'],['Raw preview follows',''],...p.rawPreview.map((r,i)=>['raw '+(i+1),r.join(' | ')])]);XLSX.writeFile(wb,'ibkr_tax_workpaper_boi_rates.xlsx');let missing=fxRows.filter(x=>!x.rate);let msg='נוצר XLSX. זוהו '+p.debug.parsedLots+' שכבות מכירה. '+(p.debug.parsedLots?'בדוק את Capital_Gains.':'בדוק את Debug - כנראה שהקובץ אינו Activity Statement עם Trades/ClosedLot. ')+(missing.length?' חסרים שערים: '+missing.map(x=>x.event_date).join(', '):'');setStatus(msg,p.debug.parsedLots?'ok':'bad')}
function sum(a){return a.reduce((s,x)=>s+n(x),0)}function objRows(a){if(!a.length)return [['No rows parsed']];let ks=Object.keys(a[0]);return [ks,...a.map(o=>ks.map(k=>o[k]))]}function add(wb,name,rows){let ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=(rows[0]||[]).map(()=>({wch:24}));XLSX.utils.book_append_sheet(wb,ws,name)}
</script></body></html>
