<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IBKR BOI XLSX</title><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><style>body{font-family:Arial;margin:0;background:#f6f8fb;color:#172033}main{max-width:1000px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #d8e0ec;border-radius:14px;padding:18px;margin:14px 0}.warn{background:#fff4e5;border-color:#ffd59e}.ok{background:#eefaf0;border:1px solid #b8e5c0}.bad{background:#fee2e2;border:1px solid #fecaca}input{width:100%;box-sizing:border-box;padding:10px;margin:6px 0;border:1px solid #c7d1df;border-radius:8px}button{background:#1f6feb;color:#fff;border:0;border-radius:10px;padding:12px 18px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.ltr{direction:ltr;text-align:left}small{color:#536179}</style></head><body><main><h1>IBKR - XLSX עם שערי בנק ישראל</h1><div class="card warn"><b>מקור שערים:</b> האתר קורא קובץ <span class="ltr">boi_fx_rates.json</span> שנוצר מתוך API של בנק ישראל על ידי GitHub Action. לכל תאריך קנייה/מכירה נלקח שער הדולר היציג לאותו יום, ואם אין שער באותו יום - השער האחרון שפורסם לפניו.</div><div class="card"><h2>העלה CSV של IBKR</h2><input id="file" type="file" accept=".csv,text/csv"><div class="grid"><div><label>מס רווח הון</label><input id="cap" type="number" step="0.01" value="0.25"></div><div><label>מס דיבידנד</label><input id="divt" type="number" step="0.01" value="0.25"></div><div><label>הפסד מועבר בשח</label><input id="loss" type="number" step="1" value="0"></div><div><label>מקדמות ששולמו בשח</label><input id="paid" type="number" step="1" value="0"></div></div><button onclick="run()">חשב והורד XLSX</button><p id="status"><small>טוען קובץ שערים מבנק ישראל...</small></p></div></main><script>
let FX_CACHE=null;
async function loadFx(){try{let r=await fetch('boi_fx_rates.json?ts=' + Date.now());FX_CACHE=await r.json();document.getElementById('status').innerHTML='קובץ שערים נטען. מקור: '+(FX_CACHE.source||'Bank of Israel')+' | עדכון: '+(FX_CACHE.updated_at||'לא ידוע')}catch(e){document.getElementById('status').className='bad';document.getElementById('status').textContent='לא הצלחתי לטעון boi_fx_rates.json. נסה לרענן או להריץ את GitHub Action לעדכון שערים.'}}
loadFx();
function csv(t){let a=[],r=[],c='',q=false;for(let i=0;i<t.length;i++){let ch=t[i],nx=t[i+1];if(q){if(ch==='"'&&nx==='"'){c+='"';i++}else if(ch==='"')q=false;else c+=ch}else{if(ch==='"')q=true;else if(ch===','){r.push(c);c=''}else if(ch==='\n'){r.push(c);a.push(r);r=[];c=''}else if(ch==='\r'){}else c+=ch}}r.push(c);a.push(r);return a.filter(x=>x.some(y=>String(y).trim()))}
function n(v){let x=parseFloat(String(v??'').replace(/,/g,'').trim());return isNaN(x)?0:x}function clean(v){return String(v??'').trim()}function d(v){if(!v)return'';let s=clean(v).split(',')[0],m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];let z=new Date(s);return isNaN(z)?'':z.toISOString().slice(0,10)}function per(x){return x&&x.slice(5,7)<='06'?'H1':'H2'}function sym(s){let m=clean(s).match(/^([A-Z0-9.\-]+)\(/);return m?m[1]:''}function sourceUrl(dt){let base=FX_CACHE&&FX_CACHE.source_url?FX_CACHE.source_url:'https://edge.boi.gov.il/FusionEdgeServer/sdmx/v2/data/dataflow/BOI.STATISTICS/EXR/1.0/?c%5BBASE_CURRENCY%5D=USD&c%5BCOUNTER_CURRENCY%5D=ILS&format=csv';return base+'&endPeriod='+dt+'&lastNObservations=1'}
function rateFor(eventDate){let rates=(FX_CACHE&&FX_CACHE.rates)||{};let cur=new Date(eventDate+'T00:00:00Z');for(let i=0;i<31;i++){let key=cur.toISOString().slice(0,10);if(rates[key])return{event_date:eventDate,rate_date:key,rate:Number(rates[key]),source_url:sourceUrl(eventDate),status:key===eventDate?'exact BOI date':'previous published BOI rate'};cur.setUTCDate(cur.getUTCDate()-1)}return{event_date:eventDate,rate_date:'',rate:null,source_url:sourceUrl(eventDate),status:'MISSING - update BOI cache or enter manually'}}
function recog(nom,usd){if(nom>0&&usd>0)return Math.min(nom,usd);if(nom<0&&usd<0)return -Math.min(Math.abs(nom),Math.abs(usd));return 0}
function parseIbkr(rows){let H={},sale=null,lots=[],divs=[],wh=[],sd=new Set(),sw=new Set(),debug={tradeRows:0,sellOrders:0,closedLotsInCsv:0,parsedLots:0,parsedDividends:0,parsedWithholding:0};rows.forEach((r,i)=>{let sec=clean(r[0]),kind=clean(r[1]);if(kind==='Header'){H[sec]=r.slice(2).map(clean);if(sec!=='Trades')sale=null;return}if(kind!=='Data')return;let h=H[sec]||[],o={};h.forEach((k,j)=>o[k]=clean(r[2+j]));if(sec==='Trades'){debug.tradeRows++;let dd=o.DataDiscriminator,asset=o['Asset Category'],cur=o.Currency,s=o.Symbol;if(asset==='Stocks'&&cur==='USD'&&dd==='Order'){let q=n(o.Quantity);if(q<0){sale={symbol:s,sell_date:d(o['Date/Time']),sell_qty:Math.abs(q)};debug.sellOrders++}}if(asset==='Stocks'&&cur==='USD'&&dd==='ClosedLot'){debug.closedLotsInCsv++;if(sale&&sale.symbol===s){let q=Math.abs(n(o.Quantity)),basis=Math.abs(n(o.Basis)),pl=n(o['Realized P/L']);lots.push({source_row:i+1,symbol:s,buy_date:d(o['Date/Time']),sell_date:sale.sell_date,period:per(sale.sell_date),quantity:q,cost_basis_usd:basis,net_proceeds_usd:basis+pl,ibkr_pl_usd:pl,code:o.Code||''})}}}if(sec==='Dividends'&&o.Currency==='USD'){let dt=d(o.Date),a=n(o.Amount),de=o.Description||'',k=dt+'|'+de+'|'+a;if(dt&&!sd.has(k)){divs.push({source_row:i+1,date:dt,symbol:sym(de),description:de,gross_usd:a});sd.add(k)}}if(sec==='Withholding Tax'&&o.Currency==='USD'){let dt=d(o.Date),a=Math.abs(n(o.Amount)),de=o.Description||'',k=dt+'|'+de+'|'+a;if(dt&&!sw.has(k)){wh.push({date:dt,symbol:sym(de),usd:a});sw.add(k)}}});debug.parsedLots=lots.length;debug.parsedDividends=divs.length;debug.parsedWithholding=wh.length;return{lots,divs,wh,debug}}
async function run(){if(!FX_CACHE){alert('קובץ שערי בנק ישראל עדיין לא נטען');return}let f=document.getElementById('file').files[0];if(!f){alert('בחר CSV');return}let p=parseIbkr(csv(await f.text()));let cap=n(document.getElementById('cap').value),divt=n(document.getElementById('divt').value),loss=n(document.getElementById('loss').value),paid=n(document.getElementById('paid').value);let allDates=[...new Set([...p.lots.flatMap(x=>[x.buy_date,x.sell_date]),...p.divs.map(x=>x.date),...p.wh.map(x=>x.date)].filter(Boolean))].sort();let fxRows=allDates.map(x=>rateFor(x));let fxMap=Object.fromEntries(fxRows.map(x=>[x.event_date,x]));let whMap={};p.wh.forEach(w=>{let k=w.date+'|'+w.symbol;whMap[k]=(whMap[k]||0)+w.usd});let cg=p.lots.map(x=>{let b=fxMap[x.buy_date],s=fxMap[x.sell_date],cost=b.rate?x.cost_basis_usd*b.rate:null,cons=s.rate?x.net_proceeds_usd*s.rate:null,nom=(cost!=null&&cons!=null)?cons-cost:null,usd=s.rate?(x.net_proceeds_usd-x.cost_basis_usd)*s.rate:null,rec=(nom!=null&&usd!=null)?recog(nom,usd):null;return{...x,buy_fx:b.rate,buy_fx_date:b.rate_date,buy_fx_source:b.source_url,sell_fx:s.rate,sell_fx_date:s.rate_date,sell_fx_source:s.source_url,cost_nis_at_buy_fx:cost,consideration_nis_at_sell_fx:cons,nominal_gain_loss_nis:nom,usd_pl_at_sell_fx_nis:usd,recognized_gain_loss_nis:rec,tax_nis:rec!=null?Math.max(rec,0)*cap:null}});let dv=p.divs.map(x=>{let f=fxMap[x.date],gross=f.rate?x.gross_usd*f.rate:null,ftusd=whMap[x.date+'|'+x.symbol]||0,ftnis=f.rate?ftusd*f.rate:null,before=gross!=null?gross*divt:null,credit=(ftnis!=null&&before!=null)?Math.min(ftnis,before):null,add=(before!=null&&credit!=null)?Math.max(before-credit,0):null;return{...x,fx:f.rate,fx_rate_date:f.rate_date,fx_source:f.source_url,gross_nis:gross,foreign_tax_usd:ftusd,foreign_tax_nis:ftnis,israeli_tax_before_credit_nis:before,foreign_tax_credit_used_nis:credit,additional_israeli_tax_nis:add}});let gains=sum(cg.map(x=>Math.max(x.recognized_gain_loss_nis||0,0))),losses=sum(cg.map(x=>Math.min(x.recognized_gain_loss_nis||0,0))),net=gains+losses,taxable=Math.max(net-Math.max(loss,0),0),capTax=taxable*cap,divGross=sum(dv.map(x=>x.gross_nis||0)),foreign=sum(dv.map(x=>x.foreign_tax_nis||0)),divAdd=sum(dv.map(x=>x.additional_israeli_tax_nis||0)),balance=Math.max(capTax+divAdd-paid,0);let wb=XLSX.utils.book_new();add(wb,'Summary',[['Metric','YTD_NIS'],['Recognized capital gains',gains],['Recognized capital losses',losses],['Net capital gain/loss before carried loss',net],['Gross dividends',divGross],['Foreign tax on dividends',foreign],['Additional Israeli tax on dividends',divAdd],['Taxable capital gain after carried loss',taxable],['Estimated capital gains tax',capTax],['Paid advances entered',paid],['Estimated total balance to pay',balance]]);add(wb,'Inputs',[['Parameter','Value'],['Capital gains tax rate',cap],['Dividend tax rate',divt],['Carried capital loss NIS',loss],['Paid advances NIS',paid],['FX cache source',FX_CACHE.source],['FX cache updated_at',FX_CACHE.updated_at||'']]);add(wb,'BOI_FX_Rates',[['Event_Date','Used_Rate_Date','USD_ILS_Rate','Status','BOI_Source_URL'],...fxRows.map(x=>[x.event_date,x.rate_date,x.rate||'',x.status,x.source_url])]);add(wb,'Capital_Gains',objRows(cg));add(wb,'Dividends_Tax',objRows(dv));add(wb,'Debug',[['Field','Value'],...Object.entries(p.debug),['Missing FX dates',fxRows.filter(x=>!x.rate).map(x=>x.event_date).join(', ')||'none']]);XLSX.writeFile(wb,'ibkr_tax_workpaper_boi_rates.xlsx');let missing=fxRows.filter(x=>!x.rate);let msg='נוצר XLSX עם שערי בנק ישראל. זוהו '+p.debug.parsedLots+' שכבות מכירה. '+(missing.length?'חסרים שערים: '+missing.map(x=>x.event_date).join(', '):'כל התאריכים קיבלו שער מתוך BOI cache.');document.getElementById('status').className=missing.length?'bad':'ok';document.getElementById('status').textContent=msg}
function sum(a){return a.reduce((s,x)=>s+n(x),0)}function objRows(a){if(!a.length)return [[]];let ks=Object.keys(a[0]);return [ks,...a.map(o=>ks.map(k=>o[k]))]}function add(wb,name,rows){let ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=(rows[0]||[]).map(()=>({wch:22}));XLSX.utils.book_append_sheet(wb,ws,name)}
</script></body></html>
