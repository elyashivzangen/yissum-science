<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IBKR XLSX</title><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><style>body{font-family:Arial;margin:0;background:#f6f8fb;color:#172033}main{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #d8e0ec;border-radius:14px;padding:18px;margin:14px 0}.warn{background:#fff4e5;border-color:#ffd59e}input{width:100%;box-sizing:border-box;padding:10px;margin:6px 0;border:1px solid #c7d1df;border-radius:8px}button{background:#1f6feb;color:#fff;border:0;border-radius:10px;padding:12px 18px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}</style></head><body><main><h1>IBKR - הורדת XLSX תקין</h1><div class="card warn">הדף הזה מייצר קובץ <b>.xlsx אמיתי</b>. פתח אותו ב-Excel Desktop, אפשר External Content, ובדוק את גיליון BOI_FX_Rates. אם Excel לא מושך שערים, מלא Manual_Override.</div><div class="card"><input id="file" type="file" accept=".csv,text/csv"><div class="grid"><div><label>מס רווח הון</label><input id="cap" type="number" step="0.01" value="0.25"></div><div><label>מס דיבידנד</label><input id="divt" type="number" step="0.01" value="0.25"></div><div><label>הפסד מועבר</label><input id="loss" type="number" step="1" value="0"></div><div><label>מקדמות ששולמו</label><input id="paid" type="number" step="1" value="0"></div></div><button onclick="run()">הורד XLSX</button><p id="msg"></p></div></main><script>
const W='WEB'+'SERVICE',X='FILTER'+'XML';
function parseCSV(t){let a=[],r=[],c='',q=false;for(let i=0;i<t.length;i++){let ch=t[i],n=t[i+1];if(q){if(ch==='"'&&n==='"'){c+='"';i++}else if(ch==='"')q=false;else c+=ch}else{if(ch==='"')q=true;else if(ch===','){r.push(c);c=''}else if(ch==='\n'){r.push(c);a.push(r);r=[];c=''}else if(ch==='\r'){}else c+=ch}}r.push(c);a.push(r);return a.filter(x=>x.some(y=>String(y).trim()))}
function n(v){let x=parseFloat(String(v||'').replace(/,/g,''));return isNaN(x)?0:x}function d(v){if(!v)return'';let s=String(v).trim().split(',')[0],m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];let z=new Date(s);return isNaN(z)?'':z.toISOString().slice(0,10)}function per(x){return x&&x.slice(5,7)<='06'?'H1':'H2'}function sym(s){let m=String(s||'').match(/^([A-Z0-9.\-]+)\(/);return m?m[1]:''}
function ib(rows){let H={},sale=null,lots=[],divs=[],wh=[],sd=new Set(),sw=new Set();rows.forEach((r,i)=>{let sec=(r[0]||'').trim(),kind=(r[1]||'').trim();if(kind==='Header'){H[sec]=r.slice(2).map(x=>String(x).trim());if(sec!=='Trades')sale=null;return}if(kind!=='Data')return;let h=H[sec]||[],o={};h.forEach((k,j)=>o[k]=r[2+j]||'');if(sec==='Trades'){let dd=o.DataDiscriminator,asset=o['Asset Category'],cur=o.Currency,s=o.Symbol;if(asset==='Stocks'&&cur==='USD'&&dd==='Order'){let q=n(o.Quantity);if(q<0)sale={symbol:s,sell_date:d(o['Date/Time'])}}if(asset==='Stocks'&&cur==='USD'&&dd==='ClosedLot'&&sale&&sale.symbol===s){let q=Math.abs(n(o.Quantity)),basis=Math.abs(n(o.Basis)),pl=n(o['Realized P/L']);lots.push([i+1,s,d(o['Date/Time']),sale.sell_date,per(sale.sell_date),q,basis,basis+pl,pl,o.Code||''])}}if(sec==='Dividends'&&o.Currency==='USD'){let dt=d(o.Date),a=n(o.Amount),de=o.Description||'',k=dt+'|'+de+'|'+a;if(dt&&!sd.has(k)){divs.push([i+1,dt,sym(de),de,a]);sd.add(k)}}if(sec==='Withholding Tax'&&o.Currency==='USD'){let dt=d(o.Date),a=Math.abs(n(o.Amount)),de=o.Description||'',k=dt+'|'+de+'|'+a;if(dt&&!sw.has(k)){wh.push([dt,sym(de),a]);sw.add(k)}}});return{lots,divs,wh}}
function boi(dt){return 'https://edge.boi.gov.il/FusionEdgeServer/sdmx/v2/data/dataflow/BOI.STATISTICS/EXR/1.0/?c%5BBASE_CURRENCY%5D=USD&c%5BCOUNTER_CURRENCY%5D=ILS&endPeriod='+dt+'&lastNObservations=1'}function fxml(url,manual){return 'IF('+manual+'<>"",'+manual+',IFERROR(NUMBERVALUE('+X+'('+W+'('+url+'),"(//*[local-name()=\'ObsValue\']/@value | //*[local-name()=\'Obs\']/@OBS_VALUE)[1]")),""))'}
function setF(ws,addr,formula){if(!ws[addr])ws[addr]={t:'n',v:0};ws[addr].f=formula;delete ws[addr].v}
async function run(){let file=document.getElementById('file').files[0];if(!file){alert('בחר CSV');return}let p=ib(parseCSV(await file.text())),dates=[...new Set([...p.lots.flatMap(x=>[x[2],x[3]]),...p.divs.map(x=>x[1]),...p.wh.map(x=>x[0])].filter(Boolean))].sort(),wb=XLSX.utils.book_new();let cap=n(capEl().value),divt=n(document.getElementById('divt').value),loss=n(document.getElementById('loss').value),paid=n(document.getElementById('paid').value);
let inputs=[['Parameter','Value'],['Capital gains tax rate',cap],['Dividend tax rate',divt],['Carried capital loss NIS',loss],['Paid advances NIS',paid],['Note','Enable external content. Use Manual_Override if needed.']];XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(inputs),'Inputs');
let fx=[['Event_Date','BOI_XML_URL','Manual_Override','Effective_USD_ILS'],...dates.map(d=>[d,boi(d),'',''])],fxws=XLSX.utils.aoa_to_sheet(fx);for(let r=2;r<=dates.length+1;r++)setF(fxws,'D'+r,fxml('B'+r,'C'+r));XLSX.utils.book_append_sheet(wb,fxws,'BOI_FX_Rates');
let cg=[['source_row','symbol','buy_date','sell_date','period','quantity','cost_basis_usd','net_proceeds_usd','ibkr_pl_usd','buy_fx','sell_fx','cost_nis_at_buy_fx','consideration_nis_at_sell_fx','nominal_gain_loss_nis','usd_pl_at_sell_fx_nis','recognized_gain_loss_nis','tax_nis','code'],...p.lots.map(x=>[...x.slice(0,9),'','','','','','','','',x[9]])],cgws=XLSX.utils.aoa_to_sheet(cg);for(let r=2;r<=p.lots.length+1;r++){setF(cgws,'J'+r,'VLOOKUP(C'+r+',BOI_FX_Rates!A:D,4,FALSE)');setF(cgws,'K'+r,'VLOOKUP(D'+r+',BOI_FX_Rates!A:D,4,FALSE)');setF(cgws,'L'+r,'G'+r+'*J'+r);setF(cgws,'M'+r,'H'+r+'*K'+r);setF(cgws,'N'+r,'M'+r+'-L'+r);setF(cgws,'O'+r,'(H'+r+'-G'+r+')*K'+r);setF(cgws,'P'+r,'IF(AND(N'+r+'>0,O'+r+'>0),MIN(N'+r+',O'+r+'),IF(AND(N'+r+'<0,O'+r+'<0),-MIN(ABS(N'+r+'),ABS(O'+r+')),0))');setF(cgws,'Q'+r,'MAX(P'+r+',0)*Inputs!B2')}XLSX.utils.book_append_sheet(wb,cgws,'Capital_Gains');
let wm={};p.wh.forEach(w=>{let k=w[0]+'|'+w[1];wm[k]=(wm[k]||0)+w[2]});let dv=[['source_row','date','symbol','description','gross_dividend_usd','fx','gross_dividend_nis','foreign_tax_usd','foreign_tax_nis','israeli_tax_before_credit_nis','foreign_tax_credit_used_nis','additional_israeli_tax_nis'],...p.divs.map(x=>[...x,'','',wm[x[1]+'|'+x[2]]||0,'','','',''])],dvws=XLSX.utils.aoa_to_sheet(dv);for(let r=2;r<=p.divs.length+1;r++){setF(dvws,'F'+r,'VLOOKUP(B'+r+',BOI_FX_Rates!A:D,4,FALSE)');setF(dvws,'G'+r,'E'+r+'*F'+r);setF(dvws,'I'+r,'H'+r+'*F'+r);setF(dvws,'J'+r,'G'+r+'*Inputs!B3');setF(dvws,'K'+r,'MIN(I'+r+',J'+r+')');setF(dvws,'L'+r,'MAX(J'+r+'-K'+r+',0)')}XLSX.utils.book_append_sheet(wb,dvws,'Dividends_Tax');
let sm=[['Metric','YTD_NIS'],['Recognized capital gains',''],['Recognized capital losses',''],['Net capital gain/loss before carried loss',''],['Gross dividends',''],['Foreign tax on dividends',''],['Additional Israeli tax on dividends',''],['Taxable capital gain after carried loss',''],['Estimated capital gains tax',''],['Paid advances entered',''],['Estimated total balance to pay','']],sw=XLSX.utils.aoa_to_sheet(sm);['SUMIF(Capital_Gains!P:P,">0",Capital_Gains!P:P)','SUMIF(Capital_Gains!P:P,"<0",Capital_Gains!P:P)','SUM(Capital_Gains!P:P)','SUM(Dividends_Tax!G:G)','SUM(Dividends_Tax!I:I)','SUM(Dividends_Tax!L:L)','MAX(B4-Inputs!B4,0)','B8*Inputs!B2','Inputs!B5','MAX(B9+B7-B10,0)'].forEach((q,i)=>setF(sw,'B'+(i+2),q));XLSX.utils.book_append_sheet(wb,sw,'Summary');wb.SheetNames=['Summary','Inputs','BOI_FX_Rates','Capital_Gains','Dividends_Tax'];XLSX.writeFile(wb,'ibkr_tax_workpaper.xlsx');document.getElementById('msg').textContent='הקובץ ירד. פתח באקסל ואפשר External Content.'}
function capEl(){return document.getElementById('cap')}
</script></body></html>
